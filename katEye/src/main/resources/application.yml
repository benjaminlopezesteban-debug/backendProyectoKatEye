spring:
  application:
    name: katEye
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kateye?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:kateye}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      static-locations: file:/app/media/,file:../media/,classpath:/static/

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

kateye:
  cors:
    origen: ${CORS_ORIGEN:http://localhost:5173}
  pago:
    simulado-resultado: ${KATEYE_PAGO_SIMULADO_RESULTADO:APROBADA}
  pedido:
    expiracion-minutos: ${KATEYE_PEDIDO_EXPIRACION_MINUTOS:30}
    zona-horaria: ${KATEYE_PEDIDO_ZONA_HORARIA:America/Santiago}
